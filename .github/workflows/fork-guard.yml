name: Fork guard

# Proves Kovalio's own changes survive upstream: branding, the sync tooling, and every
# fork fix or feature pinned by a *.fork.test.* file (see FORK_PATCHES.md). A required
# check on main, so a sync PR that silently undoes fork work can't merge unnoticed.
# Run locally with `node scripts/fork-guard.mjs`.
#
# Fork-only file on purpose: upstream owns ci.yml, and a check living there could be
# lost in a sync conflict.

on:
  pull_request: {}
  push:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fork-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-guard:
    name: Fork guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fork guard
        run: node scripts/fork-guard.mjs
