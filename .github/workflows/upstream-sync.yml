name: Upstream Sync & Kovalio Brand Enforcement

# Merges oblien/openship into sync/upstream with branding factored out
# (scripts/sync-upstream.sh + scripts/brand-merge-driver.mjs), applies and verifies
# the Kovalio overlay, and opens (or refreshes) a PR into the base branch. CI and the
# required Fork guard then run on that PR, so nothing reaches the base unreviewed.
#
# Conflicts are never resolved here. With branding factored out, a conflict means a
# fork change overlaps an upstream change, and which side wins is a person's call.
# The run fails and files an issue listing the conflicts; resolve them locally with
# `bash scripts/sync-upstream.sh`, which reproduces this exact merge.
#
# Token: SYNC_TOKEN (fine-grained PAT: contents, pull requests and workflows,
# read/write) pushes the branch and opens the PR. GITHUB_TOKEN can do neither here:
# it lacks the `workflow` scope and the org forbids Actions-created PRs. A PR the
# PAT opens also triggers CI, which a GITHUB_TOKEN push would not.

on:
  schedule:
    - cron: '0 0 * * 0' # Sundays 00:00 UTC
  workflow_dispatch:
    inputs:
      base:
        description: Branch the sync PR targets
        default: develop

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/upstream
  # Syncs land in develop like every other change, then reach main through the usual
  # develop -> main PR.
  BASE_BRANCH: ${{ inputs.base || 'develop' }}
  # This repo is a GitHub fork, and the checkout gains an `upstream` remote; without
  # an explicit repo, gh resolves to oblien/openship and every PR/issue call (and the
  # open-PR skip check) silently targets upstream.
  GH_REPO: ${{ github.repository }}

jobs:
  sync-and-rebrand:
    name: Sync Upstream & Rebrand
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "Nextrium Bot"
          git config user.email "bot@nextrium.org"

      # An open sync PR may carry hand-resolved decisions; never force-push over it.
      # New upstream commits wait for the next run after it's merged or closed.
      - name: Skip while a sync PR is open
        id: open
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if gh pr view "$SYNC_BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            echo "::notice::A sync PR is already open; review it first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.open.outputs.skip != 'true'
        run: |
          set +e
          bash scripts/sync-upstream.sh "$BASE_BRANCH"
          status=$?
          set -e
          case "$status" in
            0) echo "result=merged" >> "$GITHUB_OUTPUT" ;;
            3) echo "result=current" >> "$GITHUB_OUTPUT" ;;
            1) echo "result=conflict" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::sync-upstream.sh failed ($status)"; exit "$status" ;;
          esac
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"

      - name: Push and open PR
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          git push --force origin "$SYNC_BRANCH"
          title="chore(sync): merge upstream/main (${UPSTREAM_SHA}) with Kovalio branding"
          body="Automated merge of oblien/openship main (\`${UPSTREAM_SHA}\`) with the Kovalio overlay applied and verified.

          Branding was factored out of the merge and no fork change overlapped an upstream change. Review the upstream changes and the checks before merging; the Fork guard check covers fork-specific fixes and features."
          gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "$title" --body "$body"

      - name: Report conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.merge.outputs.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The upstream sync to \`${UPSTREAM_SHA}\` stopped: these files have a fork change that overlaps an upstream change. Branding was already factored out, so each one is a real decision."
            echo
            if [ -s .git/SYNC_CONFLICTS ]; then sed 's/^/- `/; s/$/`/' .git/SYNC_CONFLICTS; else echo "- path collisions found by the overlay (see the run log)"; fi
            echo
            echo "Resolve locally:"
            echo
            echo '```'
            echo "bash scripts/sync-upstream.sh ${BASE_BRANCH}"
            echo "# decide each conflict, then:"
            echo "git add -A && node scripts/rebrand-kovalio.mjs && node scripts/rebrand-kovalio.mjs --check"
            echo "git add -A && git commit --no-edit"
            echo "git push --force origin ${SYNC_BRANCH}   # then open a PR into ${BASE_BRANCH}"
            echo '```'
            echo
            echo "Run: ${RUN_URL}"
          } > issue.md
          title="Upstream sync needs a decision"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
          else
            gh issue create --title "$title" --body-file issue.md
          fi
          echo "::error::Upstream sync stopped on conflicts; see the issue."
          exit 1
