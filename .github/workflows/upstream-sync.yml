name: Upstream Sync & Kovalio Brand Enforcement

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-rebrand:
    name: Sync Upstream & Rebrand
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git
        run: |
          git config user.name "Nextrium Bot"
          git config user.email "bot@nextrium.org"

      - name: Add Upstream Remote & Fetch
        run: |
          git remote add upstream https://github.com/oblien/openship.git || true
          git fetch upstream main

      - name: Create Sync Branch & Merge Upstream
        run: |
          git checkout -B sync-upstream-latest
          git merge upstream/main -m "chore(sync): merge latest upstream/main" --no-edit || true

      - name: Run Kovalio Brand Overlay Engine
        run: |
          node scripts/rebrand-kovalio.mjs

      - name: Check for Brand Diffs & Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(brand): enforce Kovalio brand overlay across codebase"
            git push origin sync-upstream-latest --force
          fi
