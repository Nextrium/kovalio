# ──────────────────────────────────────────────────────────
# Kovalio — Docker Compose (SELF-HOSTED, pull-based)
#
# Run from the REPO ROOT (paths below are relative to docker/):
#   cp .env.example .env          # then edit
#   docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# Upgrade:  docker compose -f docker/docker-compose.yml --env-file .env pull && \
#           docker compose -f docker/docker-compose.yml --env-file .env up -d
#
# Names every container/volume/network `kovalio-*` instead of letting compose
# derive the prefix from this directory (which produced `docker-api-1`).
#
# UPGRADING AN EXISTING STACK: the project name is also the VOLUME prefix, so
# adopting this on a running install points postgres_data/certs at fresh empty
# volumes — the old data is still on disk under the previous prefix, just not
# mounted. Either keep the old name (`docker compose -p docker …`) or copy the
# volumes over first.
#
# NOTE: `kovalio up` (the CLI) does NOT use this file — it generates its own
# equivalent stack at ~/.kovalio/compose/. This file is the reference for
# advanced git-clone self-hosters. Keep the two in sync (apps/cli/src/lib/compose.ts).
#
# PULL-BASED by default: `api` + `dashboard` + `edge` come from published images
#   on GHCR (ghcr.io/oblien/*; KOVALIO_IMAGE_REGISTRY overrides for a mirror).
#   Pin KOVALIO_VERSION in .env for reproducible upgrades. To BUILD from source
#   instead, layer the override:
#     docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml \
#       --env-file .env up -d --build
#
# The SaaS control plane is the ROOT ../docker-compose.yml, not this file.
#
# Services:
#   • postgres → private :5432   (storage)
#   • redis    → private :6379   (queue + cache + rate-limit)
#   • api      → :4000   (override: API_PORT)
#   • dashboard→ :3001   (override: DASHBOARD_PORT)
#   • edge     → :80 / :443  (OpenResty routing + TLS, host networking; Linux)
#
# DOCKER ACCESS: `api` mounts the host Docker socket so the control plane can
# build + run your deployed apps as host containers (Docker-out-of-Docker). The
# api container is therefore host-privileged through the socket — run it only on
# a trusted host and don't expose the API to untrusted networks.
#
# The API auto-migrates Postgres on boot. postgres/redis are internal-only; a
# reverse proxy maps public domains to the api/dashboard ports.
#
# REMOTE ACCESS: reaching this from another machine (LAN IP or a reverse proxy)
# requires KOVALIO_PUBLIC_URL in .env — else the dashboard loads but login is
# rejected (403 ORIGIN_REJECTED). Behind a proxy also set TRUST_PROXY=true.
#
# BIND INTERFACE: the api/dashboard ports publish on 127.0.0.1 (loopback) by
# default — the bundled `edge` (host-networked OpenResty) fronts your public
# domains and reaches them over loopback, so nothing needs to sit on a public
# interface. Set KOVALIO_BIND_ADDR only if you deliberately want direct off-box
# access without a domain (e.g. KOVALIO_BIND_ADDR=0.0.0.0 or a LAN IP). See
# .env.example → "Remote access".
# ──────────────────────────────────────────────────────────

name: kovalio

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ─── Database (storage, private) ──────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Fresh installs keep the data dir in a SUBDIR of the volume so initdb never
      # runs against a bare mount root (fails on quirky host filesystems with
      # "Operation not permitted" — #350). UPGRADING an install that already had
      # its DB at the mount root? Set PGDATA=/var/lib/postgresql/data in your .env
      # first — otherwise Postgres inits a fresh empty DB (your data stays in the
      # volume, just unused, until you point PGDATA back). The `kovalio up` CLI
      # handles this automatically; this note is for raw `docker compose` users.
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
      POSTGRES_USER: ${POSTGRES_USER:-kovalio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — re-run `kovalio up` to regenerate .env}
      POSTGRES_DB: ${POSTGRES_DB:-kovalio}
    # PRIVATE: not published to the host. api reaches it at postgres:5432.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kovalio} -d ${POSTGRES_DB:-kovalio}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── Cache / Queue / Rate-limit (private) ─────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    # PRIVATE: not published to the host. api reaches it at redis:6379.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── API (control plane) ──────────────────────────────
  api:
    image: ${KOVALIO_IMAGE_REGISTRY:-ghcr.io/oblien}/kovalio-api:${KOVALIO_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Loopback by default — the host-net edge reaches it over loopback.
      # KOVALIO_BIND_ADDR opts into a public/LAN interface (see header note).
      # API_PORT overrides the port (host + container move together).
      - "${KOVALIO_BIND_ADDR:-127.0.0.1}:${API_PORT:-4000}:${API_PORT:-4000}"
    # Host Docker socket → the API (dockerode) builds + runs deployed apps on the
    # host daemon. dockerode's local transport targets the CONTAINER path, which is
    # why only the host side is a variable: a rootless daemon runs as the invoking
    # user and keeps its socket under that user's runtime dir
    # (/run/user/<uid>/docker.sock). Docker creates a missing bind source as an
    # empty DIRECTORY rather than failing, so leaving the rootful path pinned there
    # brings this stack up and then fails every container operation in the transport,
    # naming neither the path nor the cause (#482). Find yours with
    # `docker context inspect --format '{{.Endpoints.docker.Host}}'`.
    #
    # The four routing mounts are SHARED with the `edge` service (API writes vhosts,
    # certs and static doc-roots; the edge reads/serves them) and are HOST BIND
    # MOUNTS, not named volumes. That is deliberate: Docker-managed volumes hide
    # edge state from every host-side reader we have — the migrate wizard's proxy
    # scan, migration cert carry, cert reuse, the mail server's cert symlinks — and
    # each of those silently reported "nothing there" instead of failing. Certs and
    # static keep the SAME path inside and out, so those readers need no
    # translation and a bare→container conversion inherits existing certs.
    # `:z` relabels for SELinux-enforcing hosts; a no-op elsewhere.
    volumes:
      - ${KOVALIO_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - /var/lib/kovalio/edge/sites-enabled:/usr/local/openresty/nginx/conf/sites-enabled:z
      - /etc/letsencrypt:/etc/letsencrypt:z
      - /var/lib/kovalio/edge/acme:/var/www/acme:z
      - /opt/kovalio/static:/opt/kovalio/static:z
      # Host-op SSH key (createHostExecutor → host.docker.internal), at the path
      # KOVALIO_HOST_SSH_KEY names. /dev/null when the host channel isn't
      # provisioned, which is what lets this stack come up on a box with no key:
      # KOVALIO_HOST_SSH_HOST stays unset, host operations REFUSE (they'd
      # otherwise run against this container's filesystem, #509) and ordinary
      # deploys keep working over the socket above. Set KOVALIO_HOST_KEY_PATH to
      # an ABSOLUTE host path to activate it — a relative one resolves against
      # docker/, not the directory you run compose from. See .env.example → "Host
      # operations from the container".
      - ${KOVALIO_HOST_KEY_PATH:-/dev/null}:/run/secrets/kovalio_host_key:ro
    # Reach the HOST over the internal docker bridge (host.docker.internal →
    # host-gateway) for host-OS ops when configured (KOVALIO_HOST_SSH_*, set up
    # by `kovalio up`; by hand on this file — see .env.example). Harmless when
    # unset: host ops refuse rather than target the container. Linux needs the
    # explicit mapping.
    #
    # `host-gateway` is resolved by the daemon and is right on a stock rootful
    # install. It is NOT universally right: under rootless Docker it lands in
    # RootlessKit's namespace rather than the host's, so the host's sshd isn't there
    # (#482). KOVALIO_HOST_GATEWAY re-points the alias — e.g. at the box's own LAN
    # address — which is the seam the CLI-generated stack uses too.
    extra_hosts:
      - "host.docker.internal:${KOVALIO_HOST_GATEWAY:-host-gateway}"
    # Mode + secrets (CLOUD_MODE, DEPLOY_MODE, KOVALIO_TARGET, Oblien, GitHub
    # App, auth secrets, …) all come from .env. The values below OVERRIDE it
    # with the fixed internal port + in-cluster service DNS (compose
    # `environment` wins over `env_file`).
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "${API_PORT:-4000}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-kovalio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — re-run `kovalio up` to regenerate .env}@postgres:5432/${POSTGRES_DB:-kovalio}
      REDIS_URL: redis://redis:6379
      # Route via the containerized edge (below) instead of host OpenResty: the
      # API writes vhosts to the shared volume + reloads/certbots via `docker exec`.
      KOVALIO_EDGE_MODE: docker
      KOVALIO_EDGE_CONTAINER: kovalio-edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:${API_PORT:-4000}/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ─── Dashboard (app UI) ───────────────────────────────
  dashboard:
    image: ${KOVALIO_IMAGE_REGISTRY:-ghcr.io/oblien}/kovalio-dashboard:${KOVALIO_VERSION:-latest}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${KOVALIO_BIND_ADDR:-127.0.0.1}:${DASHBOARD_PORT:-3001}:${DASHBOARD_PORT:-3001}"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: "${DASHBOARD_PORT:-3001}"
      INTERNAL_API_URL: http://api:${API_PORT:-4000}
    depends_on:
      api:
        condition: service_healthy

  # ─── Edge (OpenResty on :80/:443) ─────────────────────
  # The routing/TLS edge as a CONTAINER (not bare host OpenResty). Host
  # networking so it binds host :80/:443 directly and reaches deployed app
  # containers at 127.0.0.1:<hostPort> exactly like a bare edge — the API's
  # vhost config is unchanged. The API drives it via `docker exec` + the shared
  # volumes above. LINUX ONLY (host networking); on mac/win use the bare CLI.
  edge:
    image: ${KOVALIO_IMAGE_REGISTRY:-ghcr.io/oblien}/kovalio-edge:${KOVALIO_VERSION:-latest}
    # PINNED, and it must stay pinned: the api reaches the edge by NAME through
    # DockerEdgeExecutor (KOVALIO_EDGE_CONTAINER above), and "ours" edge
    # detection greps `docker ps --filter name=kovalio-edge`. Without this,
    # compose derives `<project>-edge-1` from the directory and every
    # `docker exec` into the edge fails with "No such container: kovalio-edge".
    # Safe here: the edge is a singleton (host networking, one per box).
    container_name: kovalio-edge
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    volumes:
      - /var/lib/kovalio/edge/sites-enabled:/usr/local/openresty/nginx/conf/sites-enabled:z
      - /etc/letsencrypt:/etc/letsencrypt:z
      - /var/lib/kovalio/edge/acme:/var/www/acme:z
      - /opt/kovalio/static:/opt/kovalio/static:z

volumes:
  postgres_data:
  redis_data:
